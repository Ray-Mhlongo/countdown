
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown till I get to taste Okuhle's lasagna</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #30120b, #8b3e1f, #e6a15a);
            color: white;
            text-align: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 750px;
            padding: 40px 20px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: clamp(2rem, 6vw, 3.5rem);
            margin-bottom: 15px;
            line-height: 1.2;
        }

        .subtitle {
            font-size: 1.1rem;
            margin-bottom: 35px;
            color: #ffe2c1;
        }

        .countdown {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .time-box {
            padding: 20px 8px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 16px;
        }

        .number {
            display: block;
            font-size: clamp(2rem, 7vw, 3.5rem);
            font-weight: bold;
            font-variant-numeric: tabular-nums;
        }

        .label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #ffe2c1;
        }

        .footer {
            margin-top: 30px;
            font-size: 1rem;
            line-height: 1.6;
        }

        @media (max-width: 450px) {
            .container {
                padding: 30px 12px;
            }

            .countdown {
                gap: 8px;
            }

            .time-box {
                padding: 18px 4px;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>Countdown till I get to taste Okuhle's lasagna</h1>

        <p class="subtitle">
            Every second brings me closer to greatness. 🍝
        </p>

        <div class="countdown" id="countdown">
            <div class="time-box">
                <span class="number" id="hours">00</span>
                <span class="label">Hours</span>
            </div>

            <div class="time-box">
                <span class="number" id="minutes">00</span>
                <span class="label">Minutes</span>
            </div>

            <div class="time-box">
                <span class="number" id="seconds">00</span>
                <span class="label">Seconds</span>
            </div>
        </div>

        <p class="footer" id="message">
            Friday, 23 October 2026 at 5:00 PM 🇿🇦<br>
            The lasagna awaits.
        </p>
    </main>

    <script>
        const targetDate = new Date("2026-10-23T15:00:00Z");

        function updateCountdown() {
            const difference = targetDate.getTime() - Date.now();

            const countdown = document.getElementById("countdown");
            const message = document.getElementById("message");

            if (difference <= 0) {
                countdown.style.display = "none";
                message.innerHTML =
                    "IT'S LASAGNA TIME! 🍝🎉<br>" +
                    "Okuhle, the moment has arrived!";
                return;
            }

            const totalSeconds = Math.floor(difference / 1000);

            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;

            document.getElementById("hours").textContent =
                String(hours).padStart(2, "0");

            document.getElementById("minutes").textContent =
                String(minutes).padStart(2, "0");

            document.getElementById("seconds").textContent =
                String(seconds).padStart(2, "0");
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
