<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Okuhle's Overdue Lasagna</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #30120b, #8b3e1f, #e6a15a);
            color: white;
            text-align: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 850px;
            padding: 45px 20px;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: clamp(2rem, 6vw, 3.5rem);
            margin-bottom: 15px;
            line-height: 1.2;
        }

        .subtitle {
            font-size: 1.1rem;
            margin-bottom: 35px;
            color: #ffe2c1;
        }

        .countdown {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .time-box {
            padding: 22px 8px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 16px;
        }

        .number {
            display: block;
            font-size: clamp(1.8rem, 6vw, 3rem);
            font-weight: bold;
            font-variant-numeric: tabular-nums;
            color: #ffb47b;
        }

        .label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #ffe2c1;
        }

        .footer {
            margin-top: 35px;
            font-size: 1rem;
            line-height: 1.8;
        }

        .overdue {
            color: #ffb47b;
            font-weight: bold;
            font-size: 1.2rem;
        }

        @media (max-width: 550px) {
            .container {
                padding: 30px 12px;
            }

            .countdown {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <h1>Okuhle's Lasagna Tracker 🍝</h1>

        <p class="subtitle">
            Every second that passes is another second without lasagna.
        </p>

        <div class="countdown">

            <div class="time-box">
                <span class="number" id="days">-00</span>
                <span class="label">Days</span>
            </div>

            <div class="time-box">
                <span class="number" id="hours">-00</span>
                <span class="label">Hours</span>
            </div>

            <div class="time-box">
                <span class="number" id="minutes">-00</span>
                <span class="label">Minutes</span>
            </div>

            <div class="time-box">
                <span class="number" id="seconds">-00</span>
                <span class="label">Seconds</span>
            </div>

        </div>

        <p class="footer" id="message">
            <span class="overdue">STATUS: OVERDUE 🚨</span><br>
            Originally scheduled for 23 October 2026 at 5:00 PM 🇿🇦
            <br>
            The lasagna is still outstanding.
        </p>

    </main>

    <script>

        // Original lasagna appointment
        const targetDate = new Date("2026-10-23T17:00:00+02:00");

        function updateCountdown() {

            const difference = Date.now() - targetDate.getTime();

            const totalSeconds = Math.floor(difference / 1000);

            const days = Math.floor(totalSeconds / 86400);

            const hours = Math.floor((totalSeconds % 86400) / 3600);

            const minutes = Math.floor((totalSeconds % 3600) / 60);

            const seconds = totalSeconds % 60;

            document.getElementById("days").textContent =
                "-" + String(days).padStart(2, "0");

            document.getElementById("hours").textContent =
                "-" + String(hours).padStart(2, "0");

            document.getElementById("minutes").textContent =
                "-" + String(minutes).padStart(2, "0");

            document.getElementById("seconds").textContent =
                "-" + String(seconds).padStart(2, "0");

        }

        updateCountdown();

        setInterval(updateCountdown, 1000);

    </script>

</body>
</html>
